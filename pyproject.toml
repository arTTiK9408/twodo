[project]
name = "twodo"
version = "0.1.0"
description = "todo.txt manager"
authors = [
    {name = "arTTiK9408",email = "vg9408@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "textual (>=8.2.8,<9.0.0)"
]

[tool.poetry]
packages = [{include = "twodo", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "textual-dev (>=1.8.0,<2.0.0)"
]
